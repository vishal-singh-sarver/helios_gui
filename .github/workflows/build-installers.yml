name: Build & Release

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop

permissions:
  contents: write

jobs:

  ci-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run lint
      - run: npm run build

  build-windows:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build
      - run: npm run package:win

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  build-macos:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install
      - run: npm run build
      - run: npm run package:mac

      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: |
            dist/*.dmg
            dist/*.pkg

  build-linux:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: sudo apt-get update
      - run: sudo apt-get install -y libgtk-3-dev

      - run: npm install
      - run: npm run build
      - run: npm run package:linux

      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb

  release:
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate Notes
        run: |
          echo "## Helios ${GITHUB_REF_NAME} Assets" > notes.md
          echo "" >> notes.md
          echo "| OS | File | Size | SHA256 |" >> notes.md
          echo "|----|------|------|--------|" >> notes.md

          TAG=${GITHUB_REF#refs/tags/}
          REPO="${{ github.repository }}"

          for file in $(find artifacts -type f); do
            name=$(basename "$file")
            size=$(du -h "$file" | cut -f1)
            checksum=$(sha256sum "$file" | cut -d ' ' -f1)

            os="Unknown"
            [[ $name == *.exe ]] && os="Windows"
            [[ $name == *.dmg ]] && os="macOS"
            [[ $name == *.pkg ]] && os="macOS"
            [[ $name == *.AppImage ]] && os="Linux"
            [[ $name == *.deb ]] && os="Linux"

            echo "| $os | $name | $size | \`$checksum\` |" >> notes.md
          done

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          body_path: notes.md
          generate_release_notes: false